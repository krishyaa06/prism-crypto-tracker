<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism Protocol | Quantum Tracker</title>
    <meta name="description" content="Prism Protocol Quantum Tracker — a cyberpunk live crypto market dashboard with a local portfolio valuation for BTC, ETH and SOL.">
    <meta name="theme-color" content="#060810">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,4 94,27 94,73 50,96 6,73 6,27' fill='%2309152b' stroke='%2300d2ff' stroke-width='6'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='%2300d2ff' font-family='monospace' font-weight='bold'>P</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="ambient-canvas"></canvas>

    <div class="terminal-shell">
        <div class="laser-scanner"></div>

        <!-- Header -->
        <header class="terminal-top">
            <div class="brand-group">
                <div class="brand-hex">P</div>
                <div>
                    <h1 class="brand-name">PRISM PROTOCOL</h1>
                    <div class="telemetry">
                        <span class="blinking-node"></span>
                        <span class="telemetry-label">FEED // ACTIVE</span>
                        <span class="telemetry-sep">·</span>
                        <span class="telemetry-label" id="last-sync">CONNECTING</span>
                    </div>
                </div>
            </div>
            <button id="btn-sync" class="btn-action">
                <span class="sync-symbol">↻</span> SYNC
            </button>
        </header>

        <!-- Portfolio HUD Card -->
        <section class="asset-card">
            <div class="asset-meta">
                <span class="meta-label">TOTAL ESTIMATED VALUATION</span>
                <span class="badge-quantum">v2.4 CORE</span>
            </div>
            <div class="valuation-number" id="valuation-total">$0.00</div>
            
            <div class="input-matrix">
                <input type="number" id="btc-qty" placeholder="BTC" step="any" min="0" inputmode="decimal" aria-label="BTC quantity">
                <input type="number" id="eth-qty" placeholder="ETH" step="any" min="0" inputmode="decimal" aria-label="ETH quantity">
                <input type="number" id="sol-qty" placeholder="SOL" step="any" min="0" inputmode="decimal" aria-label="SOL quantity">
                <button id="btn-update-holdings" class="btn-prime">COMMIT</button>
            </div>
        </section>

        <!-- Search Bar -->
        <div class="search-wrapper">
            <span class="search-badge">⌕</span>
            <input type="text" id="token-filter" placeholder="Filter token ledger..." aria-label="Filter tokens" autocomplete="off">
        </div>

        <!-- Token Feed -->
        <div class="token-container" id="token-feed" aria-live="polite">
            <div class="feed-spinner-box">
                <div class="matrix-loader"></div>
                <p>INITIALIZING QUANTUM FEED...</p>
            </div>
        </div>

        <footer class="terminal-footer">
            <span>Data: <a href="https://www.coingecko.com" target="_blank" rel="noopener">CoinGecko</a> · auto-refresh 60s</span>
            <a href="https://dc.gg/prismprotocol" target="_blank" rel="noopener">Join Prism Protocol →</a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
